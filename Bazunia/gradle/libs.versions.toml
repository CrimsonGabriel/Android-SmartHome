[versions]
# Wersje wtyczek
agp = "8.9.1"

# Wersje bibliotek UI i Android
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
colorpicker = "0.0.15"

# --- NOWE WERSJE (Credential Manager) ---
# To zastępuje stare logowanie Google
credentials = "1.3.0"
googleid = "1.1.1"

# Narzędzia
gson = "2.10.1"
zxingEmbedded = "4.3.0"

# Sieciowe
okhttp = "4.12.0"
nanohttpd = "2.3.1"
json = "20240303"

# Testowe
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"

[libraries]
# UI i Android
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
colorpicker = { module = "com.github.QuadFlask:colorpicker", version.ref = "colorpicker" }

# --- NOWE BIBLIOTEKI (Credential Manager) ---
# Używamy ich zamiast starego play-services-auth
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Narzędzia
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }

# Sieciowe
# Zachowałem Twoje nazwy aliasów (np. okhttp-v4120), żeby build.gradle się nie wysypał
okhttp-v4120 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
json-v20240303 = { module = "org.json:json", version.ref = "json" }

# Testowe
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }